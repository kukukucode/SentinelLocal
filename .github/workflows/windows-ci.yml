name: Windows CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: PowerShell 5.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests (no installation or real Defender scans)
        run: |
          & .\tests\Run-Tests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pilot reliability and package trust regression
        run: |
          & .\tests\Run-PilotTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-pilot-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Security boundaries and protected staging regression
        run: |
          & .\tests\Run-SecurityTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-security-tests') -RequireSecureStagingTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows package preflight
        run: |
          & .\scripts\SelfTest-SentinelLocal.ps1 -Root $env:GITHUB_WORKSPACE -PreStart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline evaluation aggregation tests (synthetic records only)
        run: |
          & .\tests\Run-EvaluationTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-evaluation-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Watcher startup regressions (mocked telemetry, no installation)
        run: |
          & .\tests\Run-WatcherStartupTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-watcher-startup-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Evaluation readiness tests (read-only probes and fixtures)
        run: |
          & .\tests\Run-EvaluationReadinessTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-evaluation-readiness-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benign observation recording tests
        run: |
          & .\tests\Run-BenignObservationTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-benign-observation-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify clean diff
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Durable process identity regressions
        run: |
          & .\tests\Run-SysmonProcessTests.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-sysmon-process-tests')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Sysmon process creation integration (ephemeral CI VM)
        run: |
          & .\tests\Run-SysmonIntegration.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'SentinelLocal-sysmon-integration')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/SentinelLocal-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-pilot-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-security-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-evaluation-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-evaluation-readiness-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-watcher-startup-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-benign-observation-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-sysmon-process-tests/test-results.json
            ${{ runner.temp }}/SentinelLocal-sysmon-integration/test-results.json
            ${{ runner.temp }}/SentinelLocal-sysmon-integration/captured-processes.json
          if-no-files-found: warn
          retention-days: 14
